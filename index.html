<style>
:root{--bg:#0b0b0b;--card:#171717;--card2:#222;--y:#FFD000;--o:#FF6B00;--txt:#fff;--mut:#9a9a9a;--g:#22c55e;--r:#ef4444;--line:#2c2c2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif}

.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* סיום */
#final{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#2a1d00,#000 70%);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#final.show{display:flex}

.pod{flex:1;display:flex;flex-direction:column;align-items:center}
.pod .who{font-weight:900;font-size:16px;margin-bottom:6px;word-break:break-word}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;font-weight:900;color:#000}
.pod.p1 .blk{height:170px;background:linear-gradient(var(--y),var(--o));font-size:40px}
.pod.p2 .blk{height:120px;background:linear-gradient(#e5e5e5,#9a9a9a);font-size:32px}
.pod.p3 .blk{height:90px;background:linear-gradient(#e0a060,#a0602a);font-size:28px}
.pod .blk small{font-size:14px}
.closing{font-weight:900;font-size:20px;margin:14px 0 22px}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:60}

</style>

<!-- ============================================================

     ============================================================ -->
<script id="DATA">
const GAMES = [
  { id:'g1', home:'מכבי יפו',        away:'עירוני מודיעין' },
  { id:'g2', home:'הפועל עפולה',     away:'מכבי הרצליה' },
  { id:'g3', home:'מ.ס קרית ים',     away:'מ.ס כפר קאסם' },
  { id:'g4', home:'מכבי אחי נצרת',   away:'הפועל כפר סבא' },
  { id:'g5', home:'מ.ס אשדוד',       away:'מכבי קריית גת' },
];
const KICKOFF_LABEL = '16:00';
const LOCK_AT = new Date('2026-10-16T16:00:00+03:00');   // נעילה אוטומטית (שעון ישראל)
const PTS_EXACT = 5;                                       // ניקוד: תוצאה מדויקת
const PTS_DIR = 3;                                         // ניקוד: כיוון נכון (ניצחון/תיקו/הפסד)
const JOKER_MULT = 2;                                      // ג'וקר: מכפיל הנקודות במשחק הנבחר
const BRAVE_BONUS = 2;                                     // בונוס אמיץ: היחיד שפגע בתוצאה מדויקת
const PENALTIES = ['חייב 20 ברפיז ב-BUX 😅','חייב 50 סקוואטים ב-BUX 🦵','חייב 30 שכיבות סמיכה ב-BUX 💪']; // אחרון, לפני אחרון, שלישי מהסוף
const ADMIN_PIN = '1234';                                  // קוד מנהל
const ADS = [
  'הניחוש הזה מוגש בחסות <b>CrossFit BUX</b> – כי גם לנחש צריך כושר',
  'טעית? <b>10 ברפיז</b> ב-BUX יהוד',
  'תוצאה מדויקת = <b>PR אישי</b> 💪',
  'הניחושים מתחממים. אתה? <b>WOD ב-BUX</b> 🔥',
  'הקורה של השער? אצלנו קוראים לזה <b>Pull-up bar</b> 🏋️',
  'כמו בכדורגל, גם ב-BUX – <b>מי שלא מגיע לאימון, מפסיד</b>',
  'הפסדת בניחושים? לפחות תנצח ב-<b>Burpee test</b> 😅',
];
const DB = 'https://command-center-gal-default-rtdb.europe-west1.firebasedatabase.app';
const NODE = 'bux-predictions' + (/[?&]test=1/.test(location.search) ? '/test' : '');   // ?test=1 = סביבת בדיקה נפרדת
</script>

<header>
  <h1>ליגת הניחושים של CrossFit BUX 🏋️⚽</h1>
  <div class="sub">ליגה לאומית · כל המשחקים ב-16:00 · הספונסר הרשמי: CrossFit BUX</div>
</header>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<div id="final"></div>
<div id="goalbar"></div>
<canvas id="conf"></canvas>

<script>
// ---------- מצב ----------
let S = { players:{}, results:{}, meta:{} };   // מסונכרן מ-Firebase בזמן אמת
let connected = false, firstLoad = true;
let me = lsGet('bux_name');                     // השם נשמר במכשיר
let tab = lsGet('bux_tab') || 'pred';
let isAdmin = sessionGet('bux_admin') === '1';
let draft = null, dirty = false;
let seenGoals = null, goalTimer = null;
let aed = null;                                 // עריכת ניחושים ע"י מנהל
// מזהה מכשיר אקראי – רק המכשיר שיצר שחקן יכול לערוך אותו (נשמר גיבוב בלבד)
let DEVICE = lsGet('bux_dev'); if(!DEVICE){ DEVICE = (crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)); lsSet('bux_dev', DEVICE); }
let MYHASH = null;
(async()=>{ try{ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bux:'+DEVICE)); MYHASH=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=0; for(const c of 'bux:'+DEVICE) h=(h*31+c.charCodeAt(0))|0; MYHASH='h'+(h>>>0).toString(16)+DEVICE.length; } render(); })();
const isMine = p => !p || !p.owner || p.owner===MYHASH;
let finalShown = false, adIdx = Math.floor(Math.random()*ADS.length);

function lsGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function lsSet(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch(e){} }
function sessionGet(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }
function sessionSet(k,v){ try{sessionStorage.setItem(k,v)}catch(e){} }
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf = name => name.trim().replace(/[.#$\[\]\/]/g,'_');

// ---------- Firebase: האזנה חיה (SSE) + כתיבה ----------
function applyAt(path, data){
  const parts = path.split('/').filter(Boolean);
  if(!parts.length){ S = Object.assign({players:{},results:{},meta:{}}, data||{}); return; }
  let o = S;
  for(let i=0;i<parts.length-1;i++){ if(typeof o[parts[i]]!=='object'||o[parts[i]]===null) o[parts[i]]={}; o=o[parts[i]]; }
  const last = parts[parts.length-1];
  if(data===null) delete o[last]; else o[last]=data;
  S.players=S.players||{}; S.results=S.results||{}; S.meta=S.meta||{};
}
function listen(){
  const es = new EventSource(`${DB}/${NODE}.json`);
  const onMsg = (isPatch) => ev => {
    const {path, data} = JSON.parse(ev.data);
    if(isPatch) for(const k in data) applyAt(path.replace(/\/$/,'')+'/'+k, data[k]);
    else applyAt(path, data);
    connected = true;
    if(firstLoad){ firstLoad=false; initDraft(); }
    syncDraftFromServer();
    detectGoals();
    render();
  };
  es.addEventListener('put', onMsg(false));
  es.addEventListener('patch', onMsg(true));
  es.onerror = () => { connected=false; renderStatus(); };
  es.onopen = () => { connected=true; renderStatus(); };
}
async function api(method, path, body){
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), 8000);   // אינטרנט חלש: לא תוקעים
  try{
    const r = await fetch(`${DB}/${NODE}${path?'/'+path:''}.json`, {method, body: body===undefined?undefined:JSON.stringify(body), signal:ctl.signal});
    if(!r.ok) throw new Error('שגיאת שמירה');
    return r;
  } finally { clearTimeout(t); }
}
// שמירה עם ניסיונות חוזרים + הודעה ברורה
async function save(method, path, body, okMsg='נשמר! ✅'){
  for(let i=1;i<=4;i++){
    try{ await api(method, path, body); if(okMsg) toast(okMsg, true); return true; }
    catch(e){ if(i<4){ toast(`השמירה נכשלה 📶 מנסה שוב… (${i+1}/4)`, false, 'err'); await new Promise(r=>setTimeout(r, 1200*i)); } }
  }
  toast('❌ לא נשמר – בדוק קליטה ולחץ שוב', false, 'err', 5000);
  return false;
}

// ---------- נעילה ----------
function isLocked(){
  const l = S.meta.lock;
  if(l==='locked') return true;
  if(l==='open') return false;
  return Date.now() >= LOCK_AT.getTime();
}

// ---------- ניקוד ----------
function hasResult(g, R=S.results){ const r=R[g.id]; return r && (r.status==='live'||r.status==='finished'); }
const sign = n => n>0?1:n<0?-1:0;
function judge(pred, res){ // 'ex' | 'di' | 'wr'
  if(!pred||!res) return null;
  if(pred.h===res.h && pred.a===res.a) return 'ex';
  if(sign(pred.h-pred.a)===sign(res.h-res.a)) return 'di';
  return 'wr';
}
const sc = (h,a,sep=' : ') => `<span class="scr">${h|0}${sep}${a|0}</span>`;   // תוצאה – הבית מימין
const anyResult = (R=S.results) => GAMES.some(g=>hasResult(g,R));
const actualTotal = (R=S.results) => GAMES.reduce((t,g)=> t + (hasResult(g,R) ? (R[g.id].h|0)+(R[g.id].a|0) : 0), 0);
function standings(R=S.results){
  const ps = Object.entries(S.players).filter(([k,p])=>p && typeof p==='object');
  // כמה פגעו בתוצאה המדויקת בכל משחק (לבונוס האמיץ)
  const exCount = {};
  GAMES.forEach(g=>{ if(hasResult(g,R)) exCount[g.id] = ps.filter(([k,p])=>judge(p.preds&&p.preds[g.id], R[g.id])==='ex').length; });
  const total = actualTotal(R), useTotal = anyResult(R);
  const rows = ps.map(([k,p])=>{
    let pts=0, ex=0, di=0, stars=0; const per={}, brave={};
    GAMES.forEach(g=>{ if(!hasResult(g,R)) return;
      const j = judge(p.preds&&p.preds[g.id], R[g.id]);
      let v = j==='ex'?PTS_EXACT : j==='di'?PTS_DIR : 0;
      if(p.joker===g.id) v *= JOKER_MULT;
      if(j==='ex' && exCount[g.id]===1){ v += BRAVE_BONUS; stars++; brave[g.id]=true; }
      if(j==='ex') ex++; else if(j==='di') di++;
      pts += v; per[g.id] = v; });
    const tdiff = !useTotal ? 0 : (p.total==null ? 999 : Math.abs(p.total-total));
    return {k, name:p.name||k, pts, ex, di, stars, per, brave, tdiff, total:p.total, joker:p.joker, sent:!!p.preds};
  });
  // מיון: נקודות ← מדויקות ← הכי קרוב בניחוש סה"כ השערים
  rows.sort((a,b)=> b.pts-a.pts || b.ex-a.ex || a.tdiff-b.tdiff || a.name.localeCompare(b.name,'he'));
  rows.forEach((r,i)=>{ const p=rows[i-1]; r.rank = (p && p.pts===r.pts && p.ex===r.ex && p.tdiff===r.tdiff) ? p.rank : i+1; });
  return rows;
}
function rankMap(R){ const m={}; standings(R).forEach(r=>m[r.k]=r.rank); return m; }
// הדירוג לפני עדכון התוצאה האחרון (לחצים ול"עלו בטבלה")
function prevRankMap(){ const pr=S.meta.prevResults; return pr ? rankMap(pr.r||{}) : {}; }
const allFinished = () => GAMES.every(g=>S.results[g.id]&&S.results[g.id].status==='finished');

// ---------- טיוטת ניחושים ----------
function myPlayer(){ return me ? S.players[keyOf(me)] : null; }
function serverDraft(){ const p=myPlayer(); return p&&p.preds ? {preds:pick(p.preds), joker:p.joker||null, total:p.total??null} : null; }
function initDraft(){
  let saved=null; try{ saved = JSON.parse(lsGet('bux_draft')||'null') }catch(e){}
  if(saved && !saved.preds) saved=null;
  const src = saved || serverDraft();
  draft = { preds: pick((src&&src.preds)||{}), joker: (src&&src.joker)||null, total: src&&src.total!=null ? src.total : null };
  dirty = !!saved && JSON.stringify(draft)!==JSON.stringify(serverDraft());
}
function pick(preds){ const o={}; GAMES.forEach(g=>{ const v=preds[g.id]||{h:0,a:0}; o[g.id]={h:v.h|0,a:v.a|0} }); return o; }
function syncDraftFromServer(){ if(!dirty && me){ const s=serverDraft(); if(s) draft=s; } }
function saveDraft(){ dirty=true; lsSet('bux_draft', JSON.stringify(draft)); render(); }
function bump(gid, side, d){
  if(isLocked()) return;
  draft.preds[gid][side] = Math.max(0, Math.min(15, draft.preds[gid][side]+d)); saveDraft();
}
function setJoker(gid){ if(isLocked()) return; draft.joker = draft.joker===gid ? null : gid; saveDraft(); }
function bumpTotal(d){ if(isLocked()) return; draft.total = Math.max(0, Math.min(60, (draft.total??0)+d)); saveDraft(); }
async function submit(){
  if(isLocked()) return toast('הניחושים נעולים 🔒');
  const miss = [!draft.joker&&"ג'וקר 🃏", draft.total==null&&'ניחוש בונוס 🎯'].filter(Boolean);
  if(miss.length && !confirm('עוד לא בחרת '+miss.join(' ו')+' – לשלוח בכל זאת?')) return;
  const btn = document.getElementById('sendBtn'); if(btn){btn.disabled=true; btn.textContent='שולח...';}
  if(!isMine(myPlayer())){ render(); return toast('השם הזה שייך למכשיר אחר 🙅', false, 'err'); }
  const ok = await save('PUT', 'players/'+keyOf(me), {name:me.trim(), owner:MYHASH, preds:draft.preds, joker:draft.joker, total:draft.total, at:Date.now()});
  if(ok){ dirty=false; lsSet('bux_draft',null); }
  render();
}

// ---------- רינדור ----------
function ad(){ adIdx=(adIdx+1)%ADS.length; return `<div class="ad">📢 ${ADS[adIdx]}</div>`; }
function countdown(){
  const ms = LOCK_AT.getTime()-Date.now();
  if(ms<=0) return '';
  const h=Math.floor(ms/3.6e6), m=Math.floor(ms%3.6e6/6e4), s=Math.floor(ms%6e4/1e3);
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function statusBar(){
  const L=isLocked(), cd=countdown();
  return `<div class="status" id="status">
    <span class="pill"><span class="dot ${connected?'on':''}"></span>${connected?'מחובר – חי':'מתחבר...'}</span>
    <span class="pill ${L?'lock':'open'}">${L?'🔒 הניחושים נעולים':'🔓 פתוח לניחושים'+(cd&&!S.meta.lock?' · '+cd:'')}</span>
  </div>`;
}
function renderStatus(){ const el=document.getElementById('status'); if(el) el.outerHTML=statusBar(); }
function resLine(g){
  const r=S.results[g.id]; if(!r||!hasResult(g)) return '';
  return `<div class="real">תוצאה ${r.status==='live'?'<span class="live">חי</span>':'<span class="fin">הסתיים</span>'} &nbsp; ${sc(r.h,r.a)}  <span class="muted">(${esc(g.home)} – ${esc(g.away)})</span></div>`;
}

function viewLogin(){
  return `<div class="card" style="text-align:center;margin-top:24px">
    <div style="font-size:54px">🏋️⚽</div>
    <h2 style="margin-top:4px">איך קוראים לך?</h2>
    <input class="name" id="nameIn" placeholder="השם שלך" maxlength="20" autocomplete="off" enterkeyhint="go" onkeydown="if(event.key==='Enter')login()">
    <div id="loginErr" style="color:#ff8080;font-weight:900;min-height:22px;margin-bottom:6px"></div>
    <button class="btn" id="loginBtn" onclick="login()">יאללה 🔥</button>
  </div>${ad()}`;
}
async function login(){
  const v=(document.getElementById('nameIn').value||'').trim().replace(/\s+/g,' '), err=document.getElementById('loginErr');
  if(v.length<2){ err.textContent='צריך לפחות 2 אותיות 🙂'; return; }
  if(firstLoad || !MYHASH){ err.textContent='רגע, מתחבר… נסה שוב בעוד שנייה'; return; }
  const k=keyOf(v), ex=S.players[k];
  if(ex && !isMine(ex)){ err.textContent='השם הזה כבר תפוס, נסה כינוי אחר'; return; }
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='נכנס...';
  if(!ex){   // שומרים את השם מיד כדי שאף אחד אחר לא יתפוס אותו
    const ok = await save('PUT','players/'+k,{name:v, owner:MYHASH, at:Date.now()}, null);
    if(!ok){ btn.disabled=false; btn.textContent='יאללה 🔥'; return; }
  }
  me=v; lsSet('bux_name',v); lsSet('bux_draft',null); initDraft(); tab='pred'; lsSet('bux_tab','pred'); render();
}
function logout(){ if(!confirm('להתנתק מהמכשיר?')) return; me=null; lsSet('bux_name',null); lsSet('bux_draft',null); render(); }

function viewPred(){
  const L=isLocked(), p=myPlayer(), mine=standings().find(r=>r.k===keyOf(me));
  let h = statusBar() + `<h2>הניחושים של ${esc(me)} 🎯</h2>
    <div class="muted">${PTS_EXACT} נק' לתוצאה מדויקת · ${PTS_DIR} נק' לכיוון נכון · 🃏 ג'וקר = נקודות ×${JOKER_MULT} · ⭐ היחיד שפגע במדויק = +${BRAVE_BONUS} · משחק חי נספר לפי התוצאה הנוכחית · ${L?'הניחושים נעולים':'אפשר לערוך עד '+KICKOFF_LABEL}</div>`;
  GAMES.forEach((g,i)=>{
    const d=draft.preds[g.id], r=S.results[g.id], j=hasResult(g)?judge(p&&p.preds&&p.preds[g.id],r):null, isJ=draft.joker===g.id;

      <div class="meta"><span>משחק ${i+1} · ליגה לאומית</span><span>${KICKOFF_LABEL}${j?' · '+(j==='ex'?'🎯':j==='di'?'✔️':'❌')+' +'+v+(mine.brave[g.id]?' ⭐':''):''}</span></div>

      </div>${resLine(g)}
      ${(!L||isJ)?`<button class="jkb ${isJ?'on':''}" ${L?'disabled':''} onclick="setJoker('${g.id}')">🃏 ${isJ?`ג'וקר! הנקודות כאן ×${JOKER_MULT}`:"הפוך לג'וקר"}</button>`:''}</div>`;
    if(i===2) h+=ad();
  });

    <div class="muted">כמה שערים ייכנסו בסך הכול ב-5 המשחקים? (שובר שוויון)</div>
    <div class="step"><button class="minus" ${L||!draft.total?'disabled':''} onclick="bumpTotal(-1)">−</button>
      <span class="val">${draft.total??'?'}</span>
      <button class="plus" ${L?'disabled':''} onclick="bumpTotal(1)">+</button></div>
    ${anyResult()?`<div class="muted">בינתיים נכנסו: <b style="color:#fff">${actualTotal()}</b></div>`:''}</div>`;
  if(!L){
    h += `<div class="sticky"><button class="btn" id="sendBtn" onclick="submit()">${p&&p.preds?(dirty?'עדכן ניחושים ✍️':'נשלח ✓ (אפשר לשנות)'):'שלח ניחושים 🚀'}</button>
      ${dirty&&p&&p.preds?'<div class="saved" style="color:var(--o)">יש שינויים שעוד לא נשלחו</div>':''}</div>`;

  h += ad() + `<footer>מחובר כ-${esc(me)} · <a href="#" onclick="logout();return false">החלף משתמש</a></footer>`;

function teamStep(g,side,name,val,L){
  return `<div class="team"><div class="nm">${esc(name)}</div>
    <div class="step"><button class="minus" ${L||val<=0?'disabled':''} onclick="bump('${g.id}','${side}',-1)">−</button>
    <span class="val">${val}</span>
    <button class="plus" ${L?'disabled':''} onclick="bump('${g.id}','${side}',1)">+</button></div></div>`;
}

function viewTable(){
  const rows=standings(), L=isLocked(), prev=prevRankMap();
  // עונשי BUX: לפי דירוג מהסוף (לא כולל מקום ראשון)
  const fromBottom=[...new Set(rows.map(r=>r.rank))].filter(x=>x>1).sort((a,b)=>b-a);
  let h = statusBar() + `<h2>טבלת הדירוג 🏆</h2><div class="muted">מתעדכנת חי עם כל גול · החצים = שינוי מאז עדכון התוצאה האחרון</div>`;
  if(allFinished()) h+=`<button class="btn" style="margin:12px 0" onclick="showFinal(true)">🎉 למסך הסיום</button>`;
  h += `<div class="card" style="padding:6px 10px"><table><thead><tr><th>#</th><th style="text-align:right">שם</th><th>נק'</th><th>🎯 מדויק</th><th>✔️ כיוון</th></tr></thead><tbody>`;
  if(!rows.length) h+=`<tr><td colspan="5" class="muted">עוד אף אחד לא נרשם… מי ראשון? 🏃</td></tr>`;
  rows.forEach(r=>{
    const king=r.rank===1&&rows.length>1, pi=fromBottom.indexOf(r.rank), pen=pi>=0&&pi<PENALTIES.length?PENALTIES[pi]:'';
    const d = prev[r.k]!=null ? prev[r.k]-r.rank : 0;
    const arr = d>0?`<span class="arr up">▲${d}</span>`:d<0?`<span class="arr dn">▼${-d}</span>`:'';
    h+=`<tr class="${me&&r.k===keyOf(me)?'me':''}"><td class="rk">${king?'👑':r.rank}</td>
      <td class="n">${esc(r.name)}${r.stars?' '+'⭐'.repeat(r.stars):''}${arr}${!r.sent?' <span class="muted">(לא שלח)</span>':''}
        ${king?'<span class="tag k">👑 אלוף BUX של היום</span>':''}${pen?`<span class="tag ${pi===0?'l':'p'}">${pen}</span>`:''}
        ${L&&r.sent&&r.total!=null?`<span class="mini">ניחוש סה"כ: ${r.total} שערים</span>`:''}</td>
      <td class="pts">${r.pts}</td><td>${r.ex}</td><td>${r.di}</td></tr>`;
  });
  h += `</tbody></table></div><div class="muted">⭐ = היחיד שפגע בתוצאה מדויקת (+${BRAVE_BONUS}) · שובר שוויון: מספר התוצאות המדויקות, ואז הכי קרוב בניחוש סה"כ השערים${anyResult()?` (כרגע נכנסו ${actualTotal()})`:''}</div>` + ad();
  return h;
}

    if(!list.length) h+=`<div class="muted">אין ניחושים</div>`;

async function pushResult(gid, r){
  const prev = {r: JSON.parse(JSON.stringify(S.results)), t: Date.now()};   // התוצאות לפני העדכון → חצים + "עלו בטבלה"
  S.results[gid]=r; render();
  await save('PATCH','', {['results/'+gid]:r, 'meta/prevResults':prev}, null);
}
function setScore(gid, side, d){
  const r=Object.assign({h:0,a:0,status:'live'}, S.results[gid]||{});
  r[side]=Math.max(0,(r[side]|0)+d); if(r.status==='none') r.status='live';
  pushResult(gid, r);
}
function setStatus(gid, st){
  const r=Object.assign({h:0,a:0}, S.results[gid]||{}); r.status=st;
  pushResult(gid, r);
}
async function setAuto(v){ S.meta.auto=v||undefined; render(); await save('PUT','meta/auto',v); }
async function setLock(v){ S.meta.lock=v||undefined; render(); await save('PUT','meta/lock',v); }
function aedOpen(k){
  const p=S.players[k]; if(!p) return;
  aed = aed&&aed.k===k ? null : {k, preds:pick(p.preds||{}), joker:p.joker||null, total:p.total??null};
  render();
}

function aedBump(gid,side,d){ aed.preds[gid][side]=Math.max(0,Math.min(15,aed.preds[gid][side]+d)); render(); }
async function aedSave(){
  const body={preds:aed.preds, joker:aed.joker, total:aed.total, at:Date.now()};
  if(await save('PATCH','players/'+aed.k, body)){ aed=null; render(); }
}

function adminLogin(){

function renderNav(){
  const tabs=[['pred','🎯','ניחושים'],['table','🏆','טבלה'],['games','👀','מי ניחש מה']].filter(t=>me||t[0]!=='pred');

  document.getElementById('nav').innerHTML = (me||isAdmin) ? tabs.map(([k,ic,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span class="ic">${ic}</span>${l}</button>`).join('') : '';
}
function go(k){ tab=k; lsSet('bux_tab',k); render(); window.scrollTo(0,0); }
function render(){
  const app=document.getElementById('app');
  if(!me && !isAdmin){ app.innerHTML = viewLogin() + adminLink(); renderNav(); return; }
  if(!me && tab==='pred') tab='admin';
  if(!draft) initDraft();
  if(tab==='admin'&&!isAdmin) tab='table';
  app.innerHTML = (tab==='pred'?viewPred():tab==='table'?viewTable():tab==='games'?viewGames():viewAdmin()) + adminLink();
  renderNav();
  if(allFinished() && !finalShown && connected){ finalShown=true; showFinal(); }
}
function adminLink(){ return isAdmin?'':`<footer><a href="#" onclick="adminLogin();return false">⚙️ כניסת מנהל</a> · מופעל ע"י CrossFit BUX 🏋️</footer>`; }

// ---------- מסך סיום ----------
function showFinal(){
  const rows=standings(), top=[rows[1],rows[0],rows[2]];
  const cls=['p2','p1','p3'], med=['🥈','🥇','🥉'];
  document.getElementById('final').innerHTML = `
    <h1>🏁 סוף הליגה!</h1><div class="muted">כל המשחקים הסתיימו</div>
    <div class="podium">${top.map((r,i)=>r?`<div class="pod ${cls[i]}"><div class="who">${i===1?'👑 ':''}${esc(r.name)}</div>
      <div class="blk">${med[i]}<small>${r.pts} נק'</small></div></div>`:'<div class="pod"></div>').join('')}</div>
    ${rows[0]?`<div style="font-weight:900;color:var(--y)">👑 ${esc(rows[0].name)} – אלוף BUX של היום!</div>`:''}
    <div class="closing">נתראה באימון – CrossFit BUX יהוד 🏋️</div>
    <button class="btn" style="max-width:300px" onclick="document.getElementById('final').classList.remove('show')">לטבלה המלאה</button>`;
  document.getElementById('final').classList.add('show');
  confetti();
}
function confetti(){
  const c=document.getElementById('conf'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#FFD000','#FF6B00','#fff','#22c55e','#ff3d7f'];
  const ps=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,c:cols[Math.random()*5|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6,va:-.2+Math.random()*.4}));
  const t0=Date.now();
  (function f(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.a+=p.va; if(p.y>c.height && Date.now()-t0<5000){p.y=-10;p.x=Math.random()*c.width}
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(Date.now()-t0<9000) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
function goalSnapshot(){ const o={}; GAMES.forEach(g=>{ o[g.id]=hasResult(g)?(S.results[g.id].h|0)+(S.results[g.id].a|0):-1 }); return o; }
function detectGoals(){
  const now=goalSnapshot();
  if(seenGoals) GAMES.forEach(g=>{ if(now[g.id] > Math.max(seenGoals[g.id],0)) showGoal(g); });
  seenGoals=now;
}
function showGoal(g){
  const r=S.results[g.id], prev=prevRankMap();
  const up=standings().filter(x=>prev[x.k]!=null && prev[x.k]>x.rank).length;
  const el=document.getElementById('goalbar');
  el.innerHTML=`<span class="big">⚽ גול!</span>${esc(g.home)} ${sc(r.h,r.a,'–')} ${esc(g.away)}${up?` · ${up} עלו בטבלה`:''}`;
  el.classList.add('show'); try{ navigator.vibrate&&navigator.vibrate([120,60,120]) }catch(e){}
  clearTimeout(goalTimer); goalTimer=setTimeout(()=>el.classList.remove('show'),6000);
}
function toast(msg, big, kind, ms=2400){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t=document.createElement('div'); t.className='toast'+(kind==='err'?' err':'')+(big?' big':''); t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},ms);
}

// ---------- הפעלה ----------
let wasLocked = isLocked();
setInterval(()=>{ const L=isLocked(); if(L!==wasLocked){ wasLocked=L; render(); } else renderStatus(); }, 1000);
render(); listen();
if(/[?&]admin=1/.test(location.search) || /\/admin\/?$/.test(location.pathname)){ if(isAdmin){ tab='admin'; render(); } else setTimeout(adminLogin, 300); }
</script>
